services:

  # ──────────────────────────────────────────────────────────────
  # PostgreSQL 15 — mirrors Cloud SQL instance locally
  # ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: carbon_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: carbon_db
      POSTGRES_USER: carbon_user
      POSTGRES_PASSWORD: carbon_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-apply schema and seed on first startup
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./packages/db/seed/emission_factors.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbon_user -d carbon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────
  # pgAdmin 4 — local DB GUI (optional, comment out if not needed)
  # Access at http://localhost:5050
  # Login: admin@carbon.local / admin
  # ──────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: carbon_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@carbon.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ──────────────────────────────────────────────────────────────
  # FastAPI Backend — apps/api
  # Hot-reloads on code changes via volume mount
  # ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: carbon_api
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://carbon_user:carbon_pass@db:5432/carbon_db
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ──────────────────────────────────────────────────────────────
  # Next.js Frontend — apps/web
  # Hot-reloads on code changes via volume mount
  # ──────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: carbon_web
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  pgadmin_data:
